<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pomodoro Timer Prototype</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        display: grid;
        gap: 20px;
        padding: 28px;
        border: 1px solid #d8deea;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 40px rgb(23 32 51 / 0.1);
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.2;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 650;
      }

      input {
        width: 100%;
        min-height: 44px;
        border: 1px solid #aeb8c8;
        border-radius: 6px;
        padding: 8px 12px;
        font: inherit;
      }

      input:focus-visible,
      button:focus-visible {
        outline: 3px solid #3f7df4;
        outline-offset: 2px;
      }

      .timer {
        min-height: 92px;
        display: grid;
        place-items: center;
        border: 1px solid #d8deea;
        border-radius: 8px;
        background: #eef3ff;
        font-variant-numeric: tabular-nums;
        font-size: clamp(3rem, 14vw, 4.75rem);
        font-weight: 800;
        line-height: 1;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        padding: 10px 14px;
        color: #ffffff;
        background: #1d4ed8;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        color: #172033;
        background: #e4e9f2;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .status,
      .error {
        min-height: 24px;
        margin: 0;
        line-height: 1.5;
      }

      .error {
        color: #b42318;
      }

      [data-state="running"] .timer {
        background: #e8f7ef;
        border-color: #9ad0b0;
      }

      [data-state="completed"] .timer {
        background: #fff3d6;
        border-color: #edc85f;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #0f172a;
          color: #f8fafc;
        }

        main {
          border-color: #334155;
          background: #111827;
          box-shadow: 0 18px 40px rgb(0 0 0 / 0.28);
        }

        input {
          border-color: #64748b;
          background: #0f172a;
          color: #f8fafc;
        }

        .timer {
          border-color: #334155;
          background: #172554;
        }

        button.secondary {
          color: #f8fafc;
          background: #334155;
        }

        .error {
          color: #fda29b;
        }
      }
    </style>
  </head>
  <body>
    <main data-state="idle">
      <h1>Pomodoro Timer</h1>

      <label for="minutes">
        Minutes
        <input
          id="minutes"
          name="minutes"
          type="number"
          min="1"
          max="999"
          step="1"
          value="25"
          inputmode="numeric"
          autocomplete="off"
        />
      </label>

      <div
        id="display"
        class="timer"
        role="timer"
        aria-live="polite"
        aria-atomic="true"
      >
        25:00
      </div>

      <div class="actions">
        <button id="toggle" type="button" aria-label="Start timer">Start</button>
        <button id="reset" class="secondary" type="button">Reset</button>
      </div>

      <p id="status" class="status">Ready. Press Start to unlock sound.</p>
      <p id="error" class="error" role="alert" aria-live="assertive"></p>
    </main>

    <script>
      (() => {
        const root = document.querySelector("main");
        const minutesInput = document.querySelector("#minutes");
        const display = document.querySelector("#display");
        const toggleButton = document.querySelector("#toggle");
        const resetButton = document.querySelector("#reset");
        const status = document.querySelector("#status");
        const error = document.querySelector("#error");

        const limits = { min: 1, max: 999 };
        const tickRateMs = 250;
        let audioContext = null;
        let deadline = 0;
        let durationSeconds = minutesToSeconds(limits.min);
        let remainingSeconds = durationSeconds;
        let timerId = 0;
        let running = false;

        function minutesToSeconds(minutes) {
          return minutes * 60;
        }

        function formatTime(totalSeconds) {
          const safeSeconds = Math.max(0, Math.ceil(totalSeconds));
          const minutes = Math.floor(safeSeconds / 60);
          const seconds = safeSeconds % 60;
          return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
        }

        function announce(message) {
          status.textContent = message;
        }

        function showError(message) {
          error.textContent = message;
        }

        function clearError() {
          showError("");
        }

        function setState(nextState) {
          root.dataset.state = nextState;
        }

        function readDuration() {
          const parsed = Number(minutesInput.value);
          if (!Number.isInteger(parsed)) {
            throw new Error("Use whole minutes only.");
          }
          if (parsed < limits.min || parsed > limits.max) {
            throw new Error("Choose a value from 1 to 999 minutes.");
          }
          return minutesToSeconds(parsed);
        }

        function render() {
          display.textContent = formatTime(remainingSeconds);
        }

        async function unlockAudio() {
          const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextCtor) {
            showError("AudioContext is unavailable. Visual completion still works.");
            return false;
          }

          audioContext ||= new AudioContextCtor();
          if (audioContext.state === "suspended") {
            await audioContext.resume();
          }

          const buffer = audioContext.createBuffer(1, 1, 22050);
          const source = audioContext.createBufferSource();
          source.buffer = buffer;
          source.connect(audioContext.destination);
          source.start(0);
          return audioContext.state === "running";
        }

        async function requestNotifications() {
          if (!("Notification" in window) || Notification.permission !== "default") {
            return;
          }

          try {
            await Notification.requestPermission();
          } catch {
            showError("Notifications were blocked. The visual alert will still work.");
          }
        }

        function playChime() {
          if (!audioContext || audioContext.state !== "running") {
            showError(
              "Sound could not play. Click Start once while this tab is active, then allow site sound in Chrome."
            );
            return false;
          }

          const now = audioContext.currentTime;
          [0, 0.18, 0.36].forEach((offset, index) => {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            oscillator.type = "sine";
            oscillator.frequency.value = index === 1 ? 880 : 660;
            gain.gain.setValueAtTime(0.0001, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.35, now + offset + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.16);
            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start(now + offset);
            oscillator.stop(now + offset + 0.18);
          });
          return true;
        }

        function notifyCompletion() {
          const soundPlayed = playChime();
          if ("Notification" in window && Notification.permission === "granted") {
            new Notification("Timer complete", {
              body: "Your pomodoro timer reached 00:00.",
              silent: soundPlayed,
            });
          }
        }

        function completeTimer() {
          window.clearInterval(timerId);
          timerId = 0;
          running = false;
          remainingSeconds = durationSeconds;
          setState("completed");
          toggleButton.textContent = "Start";
          toggleButton.setAttribute("aria-label", "Start timer");
          minutesInput.disabled = false;
          render();
          notifyCompletion();
          announce("Completed. Timer reset to the configured time.");
        }

        function tick() {
          remainingSeconds = Math.max(0, (deadline - Date.now()) / 1000);
          render();
          if (remainingSeconds <= 0) {
            completeTimer();
          }
        }

        async function startTimer() {
          clearError();
          try {
            durationSeconds = readDuration();
          } catch (validationError) {
            showError(validationError.message);
            return;
          }

          await unlockAudio();
          await requestNotifications();
          remainingSeconds =
            remainingSeconds > 0 && remainingSeconds < durationSeconds
              ? remainingSeconds
              : durationSeconds;
          deadline = Date.now() + remainingSeconds * 1000;
          running = true;
          setState("running");
          minutesInput.disabled = true;
          toggleButton.textContent = "Pause";
          toggleButton.setAttribute("aria-label", "Pause timer");
          announce("Running. The timer uses wall-clock time while the tab is inactive.");
          timerId = window.setInterval(tick, tickRateMs);
          tick();
        }

        function pauseTimer() {
          window.clearInterval(timerId);
          timerId = 0;
          running = false;
          remainingSeconds = Math.max(0, (deadline - Date.now()) / 1000);
          setState("paused");
          toggleButton.textContent = "Start";
          toggleButton.setAttribute("aria-label", "Resume timer");
          announce("Paused.");
          render();
        }

        function resetTimer() {
          window.clearInterval(timerId);
          timerId = 0;
          running = false;
          clearError();
          try {
            durationSeconds = readDuration();
          } catch {
            durationSeconds = minutesToSeconds(25);
            minutesInput.value = "25";
          }
          remainingSeconds = durationSeconds;
          setState("idle");
          minutesInput.disabled = false;
          toggleButton.textContent = "Start";
          toggleButton.setAttribute("aria-label", "Start timer");
          announce("Ready. Press Start to unlock sound.");
          render();
        }

        minutesInput.addEventListener("input", () => {
          if (!running) {
            resetTimer();
          }
        });

        toggleButton.addEventListener("click", () => {
          if (running) {
            pauseTimer();
          } else {
            startTimer();
          }
        });

        resetButton.addEventListener("click", resetTimer);

        document.addEventListener("visibilitychange", () => {
          if (running) {
            tick();
          }
        });

        resetTimer();

        window.pomodoroTestApi = {
          formatTime,
          readDuration,
          getState: () => ({
            display: display.textContent,
            status: status.textContent,
            error: error.textContent,
            running,
          }),
        };
      })();
    </script>
  </body>
</html>
