<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Timer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #5d6b7a;
      --border: #d6dde6;
      --focus: #005fcc;
      --good: #0f7a3b;
      --warn: #9a5b00;
      --bad: #b3261e;
      --brand: #214f7a;
      --brand-dark: #163957;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 480px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 18px 48px rgba(23, 32, 42, 0.12);
      padding: 28px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 650;
    }

    input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 12px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }

    input:focus,
    button:focus-visible {
      outline: 3px solid rgba(0, 95, 204, 0.22);
      outline-offset: 2px;
      border-color: var(--focus);
    }

    .timer {
      margin: 24px 0;
      padding: 18px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
      font-size: clamp(3.25rem, 18vw, 5rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      letter-spacing: 0;
      background: #fafbfc;
    }

    .timer.running {
      color: var(--brand);
      border-color: #9ec5e6;
      background: #eef6fc;
    }

    .timer.paused {
      color: var(--warn);
      border-color: #e8c27a;
      background: #fff7e8;
    }

    .timer.completed {
      color: var(--good);
      border-color: #9bd1ad;
      background: #ecf8f0;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 6px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      background: var(--brand);
      color: #fff;
    }

    button.primary:hover {
      background: var(--brand-dark);
    }

    button.secondary {
      background: #fff;
      border-color: var(--border);
      color: var(--text);
    }

    button.secondary:hover {
      border-color: #9aa8b8;
      background: #f4f6f8;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .status,
    .hint,
    .error {
      margin: 16px 0 0;
      min-height: 24px;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .status {
      color: var(--muted);
    }

    .status.good {
      color: var(--good);
      font-weight: 650;
    }

    .status.warn {
      color: var(--warn);
      font-weight: 650;
    }

    .error {
      color: var(--bad);
      font-weight: 650;
    }

    .hint {
      color: var(--muted);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body.completed-flash {
      animation: flash 900ms ease-in-out 2;
    }

    @keyframes flash {
      0%, 100% { background: var(--bg); }
      50% { background: #dff2e6; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <h1 id="page-title">Pomodoro Timer</h1>

    <form id="timer-form" novalidate>
      <label for="minutes">Minutes</label>
      <input
        id="minutes"
        name="minutes"
        type="number"
        min="1"
        max="999"
        step="1"
        inputmode="numeric"
        value="25"
        aria-describedby="input-help error-message"
      >
      <p id="input-help" class="hint">Enter a whole number from 1 to 999.</p>

      <div
        id="timer-display"
        class="timer"
        role="timer"
        aria-live="polite"
        aria-atomic="true"
      >25:00</div>

      <div class="controls">
        <button id="toggle-button" class="primary" type="submit" aria-label="Start timer">Start</button>
        <button id="reset-button" class="secondary" type="button" aria-label="Reset timer">Reset</button>
      </div>
    </form>

    <p id="status-message" class="status" aria-live="polite">Ready. Click Start once while this tab is visible so Chrome can unlock sound.</p>
    <p id="error-message" class="error" aria-live="assertive"></p>
    <p id="audio-message" class="hint">If Chrome blocks sound, allow site sound from the address bar, unmute the tab, then press Start again.</p>
  </main>

  <script>
    (function () {
      "use strict";

      var MIN_MINUTES = 1;
      var MAX_MINUTES = 999;
      var DEFAULT_MINUTES = 25;
      var TICK_INTERVAL_MS = 250;
      var RESET_AFTER_COMPLETE_MS = 1800;

      var form = document.getElementById("timer-form");
      var minutesInput = document.getElementById("minutes");
      var display = document.getElementById("timer-display");
      var toggleButton = document.getElementById("toggle-button");
      var resetButton = document.getElementById("reset-button");
      var statusMessage = document.getElementById("status-message");
      var errorMessage = document.getElementById("error-message");
      var audioMessage = document.getElementById("audio-message");

      var audioContext = null;
      var audioReady = false;
      var worker = null;
      var workerUrl = null;
      var intervalId = null;
      var completionResetId = null;
      var wakeLock = null;
      var originalTitle = document.title;

      var timer = {
        mode: "idle",
        configuredSeconds: DEFAULT_MINUTES * 60,
        remainingSeconds: DEFAULT_MINUTES * 60,
        deadlineMs: null,
        completionHandled: false
      };

      function formatTime(totalSeconds) {
        var safeSeconds = Math.max(0, Math.floor(totalSeconds));
        var minutes = Math.floor(safeSeconds / 60);
        var seconds = safeSeconds % 60;
        return String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
      }

      function setStatus(message, kind) {
        statusMessage.textContent = message;
        statusMessage.className = kind ? "status " + kind : "status";
      }

      function setError(message) {
        errorMessage.textContent = message || "";
      }

      function setAudioMessage(message) {
        audioMessage.textContent = message;
      }

      function validateMinutes() {
        var rawValue = minutesInput.value.trim();
        if (rawValue === "") {
          return { ok: false, message: "Enter a timer length before starting." };
        }
        if (!/^\d+$/.test(rawValue)) {
          return { ok: false, message: "Use whole minutes only. Decimals and signs are not accepted." };
        }

        var minutes = Number(rawValue);
        if (!Number.isSafeInteger(minutes)) {
          return { ok: false, message: "Use a whole number from 1 to 999." };
        }
        if (minutes < MIN_MINUTES) {
          return { ok: false, message: "Timer length must be at least 1 minute." };
        }
        if (minutes > MAX_MINUTES) {
          return { ok: false, message: "Timer length must be 999 minutes or less." };
        }

        return { ok: true, minutes: minutes };
      }

      function syncConfiguredTimeFromInput() {
        var result = validateMinutes();
        if (!result.ok) {
          return false;
        }

        timer.configuredSeconds = result.minutes * 60;
        if (timer.mode === "idle") {
          timer.remainingSeconds = timer.configuredSeconds;
        }
        return true;
      }

      function updateDisplay() {
        display.textContent = formatTime(timer.remainingSeconds);
        display.className = "timer" + (timer.mode !== "idle" ? " " + timer.mode : "");

        toggleButton.textContent = timer.mode === "running" ? "Pause" : timer.mode === "paused" ? "Resume" : "Start";
        toggleButton.setAttribute(
          "aria-label",
          timer.mode === "running" ? "Pause timer" : timer.mode === "paused" ? "Resume timer" : "Start timer"
        );

        var locked = timer.mode === "running" || timer.mode === "paused";
        minutesInput.disabled = locked;
        resetButton.disabled = timer.mode === "idle" && timer.remainingSeconds === timer.configuredSeconds;

        if (timer.mode === "running") {
          document.title = formatTime(timer.remainingSeconds) + " - Pomodoro Timer";
        } else if (timer.mode === "completed") {
          document.title = "Done - Pomodoro Timer";
        } else {
          document.title = originalTitle;
        }
      }

      function getAudioConstructor() {
        return window.AudioContext || window.webkitAudioContext || null;
      }

      async function unlockAudio() {
        var AudioContextConstructor = getAudioConstructor();
        if (!AudioContextConstructor) {
          audioReady = false;
          setAudioMessage("This browser does not expose Web Audio. The visual and desktop notification fallbacks will still work.");
          return false;
        }

        try {
          if (!audioContext) {
            audioContext = new AudioContextConstructor({ latencyHint: "interactive" });
          }
          if (audioContext.state === "suspended") {
            await audioContext.resume();
          }

          var now = audioContext.currentTime;
          var probe = audioContext.createOscillator();
          var gain = audioContext.createGain();
          gain.gain.setValueAtTime(0.0001, now);
          probe.frequency.setValueAtTime(660, now);
          probe.connect(gain);
          gain.connect(audioContext.destination);
          probe.start(now);
          probe.stop(now + 0.03);

          audioReady = true;
          setAudioMessage("Sound is unlocked for this tab. Keep Chrome and the tab unmuted for the completion chime.");
          return true;
        } catch (error) {
          audioReady = false;
          setAudioMessage("Chrome did not allow sound yet. Click Start from the visible tab, allow site sound, then try again.");
          return false;
        }
      }

      async function requestNotificationFallback() {
        if (!("Notification" in window)) {
          return "unsupported";
        }
        if (Notification.permission === "granted" || Notification.permission === "denied") {
          return Notification.permission;
        }

        if (!window.isSecureContext && window.location.protocol !== "file:") {
          return "insecure";
        }

        try {
          return await Notification.requestPermission();
        } catch (error) {
          return "blocked";
        }
      }

      function showCompletionNotification() {
        if (!("Notification" in window) || Notification.permission !== "granted") {
          return;
        }

        try {
          var notification = new Notification("Pomodoro complete", {
            body: "The timer reached 00:00.",
            silent: true,
            tag: "pomodoro-complete"
          });
          notification.onclick = function () {
            window.focus();
            notification.close();
          };
        } catch (error) {
          setAudioMessage("Desktop notification could not be shown, but the page fallback remains active.");
        }
      }

      function withTimeout(promise, timeoutMs) {
        return Promise.race([
          promise,
          new Promise(function (resolve) {
            window.setTimeout(function () {
              resolve(false);
            }, timeoutMs);
          })
        ]);
      }

      async function playCompletionChime() {
        if (!audioReady) {
          await unlockAudio();
        }
        if (!audioContext || audioContext.state === "closed") {
          return false;
        }

        try {
          if (audioContext.state === "suspended") {
            await audioContext.resume();
          }

          var now = audioContext.currentTime + 0.02;
          var master = audioContext.createGain();
          master.gain.setValueAtTime(0.0001, now);
          master.gain.exponentialRampToValueAtTime(0.26, now + 0.03);
          master.gain.exponentialRampToValueAtTime(0.0001, now + 1.25);
          master.connect(audioContext.destination);

          [784, 988, 1175].forEach(function (frequency, index) {
            var start = now + index * 0.18;
            var stop = start + 0.42;
            var tone = audioContext.createOscillator();
            var toneGain = audioContext.createGain();
            tone.type = "sine";
            tone.frequency.setValueAtTime(frequency, start);
            toneGain.gain.setValueAtTime(0.0001, start);
            toneGain.gain.exponentialRampToValueAtTime(0.9, start + 0.025);
            toneGain.gain.exponentialRampToValueAtTime(0.0001, stop);
            tone.connect(toneGain);
            toneGain.connect(master);
            tone.start(start);
            tone.stop(stop + 0.02);
          });

          return true;
        } catch (error) {
          setAudioMessage("Sound playback failed. Check Chrome site sound, tab mute state, system volume, and Do Not Disturb.");
          return false;
        }
      }

      function startWorkerTicker() {
        if (!window.Worker || worker) {
          return;
        }

        var source = [
          "var tickId = null;",
          "function sendTick(){ self.postMessage({ type: 'tick', now: Date.now() }); }",
          "self.onmessage = function(event) {",
          "  if (event.data.type === 'start') {",
          "    if (tickId) clearInterval(tickId);",
          "    sendTick();",
          "    tickId = setInterval(sendTick, " + TICK_INTERVAL_MS + ");",
          "  }",
          "  if (event.data.type === 'stop') {",
          "    if (tickId) clearInterval(tickId);",
          "    tickId = null;",
          "  }",
          "};"
        ].join("\n");

        try {
          workerUrl = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
          worker = new Worker(workerUrl);
          worker.onmessage = updateFromClock;
          worker.postMessage({ type: "start" });
        } catch (error) {
          worker = null;
          if (workerUrl) {
            URL.revokeObjectURL(workerUrl);
            workerUrl = null;
          }
        }
      }

      function stopWorkerTicker() {
        if (worker) {
          worker.postMessage({ type: "stop" });
          worker.terminate();
          worker = null;
        }
        if (workerUrl) {
          URL.revokeObjectURL(workerUrl);
          workerUrl = null;
        }
      }

      function startTickers() {
        stopTickers();
        intervalId = window.setInterval(updateFromClock, TICK_INTERVAL_MS);
        startWorkerTicker();
      }

      function stopTickers() {
        if (intervalId) {
          window.clearInterval(intervalId);
          intervalId = null;
        }
        stopWorkerTicker();
      }

      async function requestWakeLock() {
        if (!("wakeLock" in navigator) || timer.mode !== "running") {
          return;
        }

        try {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", function () {
            wakeLock = null;
          });
        } catch (error) {
          wakeLock = null;
        }
      }

      async function releaseWakeLock() {
        if (!wakeLock) {
          return;
        }

        try {
          await wakeLock.release();
        } catch (error) {
          wakeLock = null;
        }
      }

      function currentRemainingSeconds() {
        if (timer.mode !== "running" || !timer.deadlineMs) {
          return timer.remainingSeconds;
        }
        return Math.max(0, Math.ceil((timer.deadlineMs - Date.now()) / 1000));
      }

      function updateFromClock() {
        if (timer.mode !== "running") {
          return;
        }

        timer.remainingSeconds = currentRemainingSeconds();
        updateDisplay();

        if (timer.remainingSeconds <= 0) {
          completeTimer();
        }
      }

      async function startOrResumeTimer() {
        window.clearTimeout(completionResetId);
        completionResetId = null;

        if (timer.mode === "idle") {
          if (!syncConfiguredTimeFromInput()) {
            setError(validateMinutes().message);
            return;
          }
          timer.remainingSeconds = timer.configuredSeconds;
        }

        setError("");
        unlockAudio();
        timer.mode = "running";
        timer.completionHandled = false;
        timer.deadlineMs = Date.now() + timer.remainingSeconds * 1000;
        setStatus("Running. The countdown is based on an absolute deadline so inactive tab ticks can catch up.", "good");
        updateDisplay();
        startTickers();
        requestWakeLock();

        requestNotificationFallback().then(function (notificationState) {
          if (notificationState === "denied") {
            setAudioMessage("Desktop notifications are blocked. The completion chime and page flash will still be used.");
          }
        });
      }

      function pauseTimer() {
        timer.remainingSeconds = currentRemainingSeconds();
        timer.mode = "paused";
        timer.deadlineMs = null;
        stopTickers();
        releaseWakeLock();
        setStatus("Paused. Press Resume to continue from " + formatTime(timer.remainingSeconds) + ".", "warn");
        updateDisplay();
      }

      async function completeTimer() {
        if (timer.completionHandled) {
          return;
        }

        timer.completionHandled = true;
        timer.mode = "completed";
        timer.remainingSeconds = 0;
        timer.deadlineMs = null;
        stopTickers();
        releaseWakeLock();
        updateDisplay();

        document.body.classList.add("completed-flash");
        window.setTimeout(function () {
          document.body.classList.remove("completed-flash");
        }, 1900);

        showCompletionNotification();
        if (navigator.vibrate) {
          navigator.vibrate([120, 80, 120]);
        }

        setStatus("Complete. Resetting to the configured length.", "good");
        withTimeout(playCompletionChime(), 1500).then(function (soundPlayed) {
          if (timer.mode !== "completed") {
            return;
          }
          setStatus(
            soundPlayed
              ? "Complete. The chime was triggered and the timer will reset to the configured length."
              : "Complete. Sound was blocked or delayed, so the page flash and desktop notification fallback were used.",
            soundPlayed ? "good" : "warn"
          );
        });

        completionResetId = window.setTimeout(function () {
          timer.mode = "idle";
          timer.remainingSeconds = timer.configuredSeconds;
          timer.completionHandled = false;
          updateDisplay();
        }, RESET_AFTER_COMPLETE_MS);
      }

      function resetTimer() {
        window.clearTimeout(completionResetId);
        completionResetId = null;
        stopTickers();
        releaseWakeLock();

        var result = validateMinutes();
        if (result.ok) {
          setError("");
          timer.configuredSeconds = result.minutes * 60;
        }

        timer.mode = "idle";
        timer.remainingSeconds = timer.configuredSeconds;
        timer.deadlineMs = null;
        timer.completionHandled = false;
        setStatus("Ready. Click Start once while this tab is visible so Chrome can unlock sound.");
        updateDisplay();
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (timer.mode === "running") {
          pauseTimer();
          return;
        }
        startOrResumeTimer();
      });

      resetButton.addEventListener("click", resetTimer);

      minutesInput.addEventListener("input", function () {
        if (timer.mode !== "idle") {
          return;
        }
        var result = validateMinutes();
        if (!result.ok) {
          setError(result.message);
          return;
        }
        setError("");
        timer.configuredSeconds = result.minutes * 60;
        timer.remainingSeconds = timer.configuredSeconds;
        updateDisplay();
      });

      document.addEventListener("visibilitychange", function () {
        updateFromClock();
        if (document.visibilityState === "visible" && timer.mode === "running") {
          requestWakeLock();
        }
      });

      window.addEventListener("focus", updateFromClock);

      document.addEventListener("keydown", function (event) {
        var target = event.target;
        var isTyping = target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA");
        if (event.key === "Escape") {
          resetTimer();
        }
        if (event.code === "Space" && !isTyping && document.activeElement !== toggleButton && document.activeElement !== resetButton) {
          event.preventDefault();
          if (timer.mode === "running") {
            pauseTimer();
          } else {
            startOrResumeTimer();
          }
        }
      });

      window.addEventListener("beforeunload", function (event) {
        if (timer.mode !== "running") {
          return;
        }
        event.preventDefault();
        event.returnValue = "";
      });

      updateDisplay();
    })();
  </script>
</body>
</html>
